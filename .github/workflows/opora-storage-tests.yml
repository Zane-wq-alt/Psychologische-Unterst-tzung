name: Opora storage tests

on:
  push:
    branches: [opora-v2-development]
  pull_request:
    branches: [opora-v2-development]

jobs:
  storage-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.cjs
