<script>
(function(){
 if(!("serviceWorker" in navigator))return;
 var registration=null,updatePanel=document.getElementById("pwa-update"),hadController=!!navigator.serviceWorker.controller;
 function showUpdate(){if(updatePanel)updatePanel.hidden=false}
 function watch(reg){
  registration=reg;
  if(reg.waiting&&navigator.serviceWorker.controller)showUpdate();
  reg.addEventListener("updatefound",function(){
   var worker=reg.installing;if(!worker)return;
   worker.addEventListener("statechange",function(){
    if(worker.state==="installed"&&navigator.serviceWorker.controller)showUpdate();
   });
  });
 }
 window.addEventListener("load",function(){
  navigator.serviceWorker.register("sw.js").then(function(reg){
   watch(reg);if(reg.update)reg.update().catch(function(){});
  }).catch(function(){});
 });
 document.getElementById("pwa-update-accept").addEventListener("click",function(){
  if(!registration||!registration.waiting)return;
  registration.waiting.postMessage({type:"SKIP_WAITING"});
 });
 document.getElementById("pwa-update-dismiss").addEventListener("click",function(){updatePanel.hidden=true});
 navigator.serviceWorker.addEventListener("controllerchange",function(){
  if(hadController&&!window.__oporaReloaded){window.__oporaReloaded=true;window.location.reload()}
  hadController=true
 });
})();
</script></body></html>
